spring.application.name=timetracking

# PostgreSQL (overridable via environment, e.g. by Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timetracking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:timetracking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:timetracking}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Expose the actuator health endpoint (used later for container health checks)
management.endpoints.web.exposure.include=health
