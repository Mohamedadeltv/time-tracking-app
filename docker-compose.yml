services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetracking
      POSTGRES_USER: timetracking
      POSTGRES_PASSWORD: timetracking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timetracking
      SPRING_DATASOURCE_USERNAME: timetracking
      SPRING_DATASOURCE_PASSWORD: timetracking
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
